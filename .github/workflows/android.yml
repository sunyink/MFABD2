name: Android ARM64

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "项目版本或已有 Release tag；留空按项目规则生成 CI 版号"
        type: string
        default: ""
      publish:
        description: "将签名 APK 附加到上述已存在的 Release（不会创建 Release）"
        type: boolean
        default: false
  push:
    branches:
      - feat/android-native
    paths:
      - .github/workflows/android.yml
      - android/**
      - agent/**
      - assets/**
      - install.py
      - configure.py
      - tools/verify_android*.py
      - tools/android_build.py

permissions:
  contents: read

concurrency:
  # Release builds are isolated from branch pushes and from other release tags.
  group: android-arm64-${{ inputs.publish && format('release-{0}', inputs.version_name) || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.publish }}

env:
  MAAFW_TAG: v5.12.3
  AGENT_CORE_TAG: 3.13.15-maafw5.12.3
  PYTHONUTF8: "1"
  STRIP_COMMENTS: "true"

jobs:
  apk:
    if: github.repository == 'sunyink/MFABD2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.publish && inputs.version_name || github.sha }}
          fetch-depth: 0
      - name: Checkout pinned Android UI
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Aliothmoon/MaaFwApp
          ref: f4f6f220e21e3a1b7b0cf5df4bdbe0ec04c668f7
          path: android-upstream
      - name: Restore pinned OCR assets
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: sunyink/MFABD2-Assets
          ref: df9c78afd7089ff925b014f01ae650fa72f859a2
          path: android-build/assets
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Resolve project version and Android identity
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version_name }}
          PUBLISH_REQUEST: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH_REQUEST" == "true" && -z "$REQUESTED_VERSION" ]]; then
            echo "Release tag is required for publication"
            exit 1
          fi
          python tools/android_build.py metadata --version "$REQUESTED_VERSION"
      - name: Verify agent and prepare resources
        env:
          PROJECT_VERSION: ${{ steps.metadata.outputs.version_name }}
        run: |
          python -m pip install "MaaFw==5.12.3" "numpy==2.3.2" "Pillow==11.0.0" "json-with-comments==1.3.0"
          python tools/verify_android_runtime.py
          python tools/verify_android_resources.py
          python tools/verify_android_build.py
          python tools/verify_android_overlay.py
          python tools/verify_android_apk.py --interface assets/interface.json
          python agent/recognition/test_rdd_hsv_rescue.py
          PYTHONPATH=agent python -c "import action, recognition, fishing_agent"
          mkdir -p assets/MaaCommonAssets
          cp -a android-build/assets/MaaCommonAssets/. assets/MaaCommonAssets/
          python install.py "$PROJECT_VERSION" android 5.12.3
          if [ "$STRIP_COMMENTS" = "true" ]; then
            python scripts/strip_build_comments.py install
          fi
          python check_resource.py install
      - name: Assemble Android Python dependencies
        working-directory: android-upstream
        run: |
          python scripts/build_agent_bundle.py \
            --out "$GITHUB_WORKSPACE/android-build/agent-dist" \
            --abi arm64-v8a --core-tag "$AGENT_CORE_TAG" \
            --requirements "$GITHUB_WORKSPACE/android/requirements.txt" \
            --extra-index-url https://chaquo.com/pypi-13.1/
          python scripts/setup_maa_framework.py --tag "$MAAFW_TAG" --abi arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1"
      - name: Prepare signed ARM64 release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          python tools/android_build.py prepare
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          if not os.environ.get("KEYSTORE_B64") or not os.environ.get("SIGNING_PASSWORD"):
              raise SystemExit("Configure the two ANDROID_SIGNING_* repository secrets first")
          settings = json.loads(Path("android/release.json").read_text())
          path = Path(os.environ["RUNNER_TEMP"]) / "mfabd2-release.p12"
          path.write_bytes(base64.b64decode(os.environ["KEYSTORE_B64"], validate=True))
          path.chmod(0o600)
          cert = subprocess.run(["keytool", "-exportcert", "-keystore", str(path),
                                 "-storepass:env", "SIGNING_PASSWORD", "-alias", settings["key_alias"]],
                                check=True, capture_output=True).stdout
          if hashlib.sha256(cert).hexdigest() != settings["certificate_sha256"]:
              raise SystemExit("Signing certificate does not match android/release.json")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"KEYSTORE_PATH={path}\n")
          PY
      - name: Build signed ARM64 APK
        working-directory: android-upstream
        env:
          PI_PROFILE: ${{ github.workspace }}/android/pi-profile.yaml
          BUILD_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          MFABD2_APP_LABEL: ${{ steps.metadata.outputs.label }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ steps.metadata.outputs.key_alias }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify APK contents
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
        run: |
          apk="android-upstream/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > android-build/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > android-build/badging.txt
          python tools/verify_android_apk.py "$apk" --metadata android-build/build-metadata.json --badging android-build/badging.txt --signature android-build/signature.txt
          mkdir -p android-build/artifacts
          cp "$apk" "android-build/artifacts/$APK_NAME"
          cp android-build/build-metadata.json "android-build/artifacts/$APK_NAME.json"
          cd android-build/artifacts
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/mfabd2-release.p12"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MFABD2-android-arm64
          path: android-build/artifacts/
          if-no-files-found: error

  publish:
    needs: apk
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'sunyink/MFABD2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: MFABD2-android-arm64
          path: artifacts
      - name: Attach APK to the existing project release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"
          gh release upload "$RELEASE_TAG" artifacts/*.apk artifacts/*.sha256 artifacts/*.json --repo "$GH_REPO"
