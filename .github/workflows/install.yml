name: install

on:
  push:
    tags:
      - "v*"
    # `branches` 不能省。push 事件下只写 tags 而不写 branches 时，GitHub 只认 tag 推送，
    # 分支推送一概不触发——省掉这三行等于把所有分支的构建静默关掉。
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".github/workflows/install-build.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-check.yml"
      - ".github/workflows/release-cleanup.yml"
      - "android/**"
      - "assets/**"
      - "release/branding/**"
      - "TRADEMARKS.md"
      - "**.py"
      # 内核版本是从这里钉住的 MFAAvalonia 里探测出来的，改它等于换内核。
      - "requirements.txt"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".github/workflows/install-build.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-check.yml"
      - ".github/workflows/release-cleanup.yml"
      - "android/**"
      - "assets/**"
      - "release/branding/**"
      - "TRADEMARKS.md"
      - "**.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      deploy_beta:
        type: boolean
        description: "发布公测版"
        default: false # 默认不勾选，避免误触
      deploy_alpha:
        type: boolean
        description: "发布内测版"
        default: false
      ci_as_stable:
        type: boolean
        description: "CI版本作为正式发布（非预发布）"
        default: false
      notice_text:
        type: string
        description: "⚠️ 说明 / Note"
        required: false
        default: "不勾选任何选项，手动触发即为CI发版"

permissions:
  contents: read

jobs:
  route:
    name: Resolve release channel
    runs-on: ubuntu-latest
    # Sync pushes only dispatch the two release channels; they own no build slot.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[deploy-sync]')"
    outputs:
      version_type: ${{ steps.channel.outputs.version_type }}
      concurrency_group: ${{ steps.channel.outputs.concurrency_group }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up release validation Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Verify release channel and publication rules
        run: |
          python3 scripts/verify_release_channels.py
          python3 scripts/verify_release_guard.py
      - id: channel
        run: python3 scripts/release_channel.py

  build:
    needs: route
    # 普通 CI 按分支（PR 按编号）隔离；公测、内测、正式各自跨分支替换上一轮。
    # 先解析提交最后一行，再锁定整套构建，避免正文提及标记导致误取消。
    concurrency:
      group: ${{ github.workflow }}-${{ needs.route.outputs.concurrency_group }}
      cancel-in-progress: true
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/install-build.yml
    with:
      version_type: ${{ needs.route.outputs.version_type }}
    secrets: inherit
